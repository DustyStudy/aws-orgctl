name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false # never cancel a release PR update mid-flight

# release-please needs to open/update PRs and (on merge) create tags/releases,
# so it genuinely needs write access here — unlike ci.yml. Scoped to exactly
# the two permissions it documents needing, nothing broader.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # googleapis/release-please-action: official Google Cloud Platform
      # action, actively maintained with frequent releases — pinned to its
      # major version tag rather than a SHA, consistent with how this repo
      # treats other first-party/foundation-maintained actions (see
      # SECURITY.md for the full pinning rationale).
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
