name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ruff + bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: ${{ hashFiles('**/*.py') != '' }}
        with:
          python-version: "3.12"

      - name: Install and run ruff + bandit
        if: ${{ hashFiles('**/*.py') != '' }}
        run: |
          pip install ruff bandit
          ruff check .
          bandit -r . -ll --exclude ./.git

  bash:
    name: shellcheck (Bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck on every .sh file
        if: ${{ hashFiles('**/*.sh') != '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -r shellcheck

  powershell:
    name: PSScriptAnalyzer (PowerShell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer on every .ps1 file
        if: ${{ hashFiles('**/*.ps1') != '' }}
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -Exclude .git
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error }
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)"
          }

  iac-sast:
    name: checkov (CFN + Terraform, if present)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bridgecrewio/checkov-action: the underlying checkov CLI parses
      # --framework as a space-separated list of choices, not a
      # comma-separated string — "cloudformation,terraform" (one token)
      # fails argparse's choices check. Space-separate instead.
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: cloudformation terraform
          quiet: true
          soft_fail: false
