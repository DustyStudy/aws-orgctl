name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Weekly, since Scorecard measures repo-level posture (branch protection,
    # pinning, etc.) that rarely changes day-to-day.
    - cron: "30 1 * * 6"
  workflow_dispatch:

# Declared read-only at workflow level; the one job that needs more asks for
# exactly what it needs below. This shape matches OpenSSF's own recommended
# layout for this action.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # to upload SARIF results to the Security tab
      id-token: write # to sign/publish results via Sigstore
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Official OpenSSF action. Pinned to a full commit SHA like the rest
      # of this repo's third-party actions — ossf/scorecard-action does not
      # publish a floating major-version tag (only full vX.Y.Z tags), so a
      # tag-only reference like "@v2" doesn't resolve; SHA is both the more
      # secure and the only reliably-working option here.
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
